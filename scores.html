<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Scores</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="top-bar top-bar--live">
      <div class="container top-bar__inner">
        <p class="top-bar__live-title">
          <span class="live-dot" aria-hidden="true"></span>
          World Cup 2026 · Live scores
        </p>
      </div>
    </header>

    <main>
      <section class="section scores-section" aria-labelledby="scores-heading">
        <div class="container">
          <h1 class="visually-hidden" id="scores-heading">World Cup 2026 live scores</h1>
          <p class="scores-notice" id="scores-notice" hidden></p>
          <div class="scores-grid" id="scores-grid" role="list"></div>
          <p class="scores-empty" id="scores-empty" hidden>No matches to display right now.</p>
          <p class="scores-loading" id="scores-loading">Loading scores…</p>
        </div>
      </section>
    </main>

    <footer class="footer footer--compact scores-footer" id="footer">
      <div class="container">
        <p class="scores-footer__powered" id="footer-powered"></p>
        <p class="scores-footer__updated" id="footer-updated"></p>
      </div>
    </footer>

    <script src="config.js"></script>
    <script>
      var API_URL =
        "https://api.football-data.org/v4/competitions/WC/matches?status=LIVE,IN_PLAY,FINISHED,SCHEDULED";
      var API_KEY = "YOUR_API_KEY";
      var REFRESH_MS = 60000;
      var refreshTimer = null;

      function applyBrandColors() {
        document.documentElement.style.setProperty("--brand-color", CONFIG.brandColor);
        document.documentElement.style.setProperty("--brand-light", CONFIG.brandLight);
        document.documentElement.style.setProperty("--brand-text", CONFIG.brandText);
      }

      function isApiKeyMissing() {
        return !API_KEY || API_KEY === "YOUR_API_KEY";
      }

      function mapApiStatus(status) {
        if (status === "IN_PLAY" || status === "LIVE" || status === "PAUSED") {
          return "live";
        }
        if (status === "FINISHED") {
          return "ft";
        }
        return "upcoming";
      }

      function mapConfigStatus(status) {
        if (status === "live") {
          return "live";
        }
        if (status === "ft") {
          return "ft";
        }
        return "upcoming";
      }

      function normalizeApiMatch(match) {
        var homeScore = match.score && match.score.fullTime ? match.score.fullTime.home : null;
        var awayScore = match.score && match.score.fullTime ? match.score.fullTime.away : null;

        return {
          homeTeam: match.homeTeam ? match.homeTeam.name : "TBD",
          awayTeam: match.awayTeam ? match.awayTeam.name : "TBD",
          homeScore: homeScore,
          awayScore: awayScore,
          status: mapApiStatus(match.status),
          stage: match.stage ? match.stage.replace(/_/g, " ") : "",
          venue: match.venue || "",
          time: match.utcDate
            ? new Date(match.utcDate).toLocaleString("en-US", {
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit",
                timeZoneName: "short",
              })
            : "",
          scorers: (match.goals || []).map(function (goal) {
            return {
              name: goal.scorer ? goal.scorer.name : "Unknown",
              minute: goal.minute,
              team: goal.team ? goal.team.name : "",
            };
          }),
        };
      }

      function normalizeConfigMatch(match) {
        var parts = match.teams.split(" vs ");
        var homeTeam = parts[0] ? parts[0].trim() : match.teams;
        var awayTeam = parts[1] ? parts[1].trim() : "";

        return {
          homeTeam: homeTeam,
          awayTeam: awayTeam,
          homeScore: null,
          awayScore: null,
          status: mapConfigStatus(match.status),
          stage: match.stage || "",
          venue: match.venue || "",
          time: match.time || "",
          scorers: [],
        };
      }

      function formatScore(value) {
        return value !== null && value !== undefined ? value : "–";
      }

      function renderStatusBadge(status, time) {
        if (status === "live") {
          return (
            '<span class="score-card__badge score-card__badge--live">' +
            '<span class="dot" aria-hidden="true"></span>Live</span>'
          );
        }

        if (status === "ft") {
          return '<span class="score-card__badge score-card__badge--ft">Full Time</span>';
        }

        return (
          '<span class="score-card__badge score-card__badge--upcoming">' +
          "Upcoming" +
          (time ? " · " + time : "") +
          "</span>"
        );
      }

      function renderScorers(scorers) {
        if (!scorers.length) {
          return "";
        }

        var items = scorers
          .map(function (scorer) {
            return (
              '<li class="score-card__scorer">' +
              '<i class="ti ti-ball-football" aria-hidden="true"></i>' +
              scorer.name +
              " " +
              scorer.minute +
              "'</li>"
            );
          })
          .join("");

        return '<ul class="score-card__scorers">' + items + "</ul>";
      }

      function renderScoreCard(match) {
        return (
          '<article class="score-card" role="listitem">' +
          renderStatusBadge(match.status, match.time) +
          '<div class="score-card__teams">' +
          '<div class="score-card__team">' +
          '<span class="score-card__team-name">' +
          match.homeTeam +
          "</span>" +
          '<span class="score-card__team-score">' +
          formatScore(match.homeScore) +
          "</span>" +
          "</div>" +
          '<div class="score-card__team">' +
          '<span class="score-card__team-name">' +
          match.awayTeam +
          "</span>" +
          '<span class="score-card__team-score">' +
          formatScore(match.awayScore) +
          "</span>" +
          "</div>" +
          "</div>" +
          (match.stage ? '<p class="score-card__meta">' + match.stage + "</p>" : "") +
          (match.venue ? '<p class="score-card__meta">' + match.venue + "</p>" : "") +
          renderScorers(match.scorers) +
          "</article>"
        );
      }

      function renderMatches(matches) {
        var grid = document.getElementById("scores-grid");
        var emptyEl = document.getElementById("scores-empty");

        if (!matches.length) {
          grid.innerHTML = "";
          emptyEl.hidden = false;
          return;
        }

        emptyEl.hidden = true;
        grid.innerHTML = matches.map(renderScoreCard).join("");
      }

      function setLoading(isLoading) {
        document.getElementById("scores-loading").hidden = !isLoading;
      }

      function setNotice(message) {
        var notice = document.getElementById("scores-notice");
        if (message) {
          notice.textContent = message;
          notice.hidden = false;
        } else {
          notice.hidden = true;
        }
      }

      function updateFooter(updatedAt) {
        document.title = CONFIG.barName + " — Live Scores";
        document.getElementById("footer-powered").textContent = "Powered by " + CONFIG.barName;
        document.getElementById("footer-updated").textContent =
          "Last updated " +
          updatedAt.toLocaleString("en-US", {
            month: "short",
            day: "numeric",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            timeZoneName: "short",
          });
      }

      function getFallbackMatches() {
        return CONFIG.matches.map(normalizeConfigMatch);
      }

      async function loadScores() {
        setLoading(true);

        if (isApiKeyMissing()) {
          setNotice("Live data unavailable — showing matches from " + CONFIG.barName + ".");
          renderMatches(getFallbackMatches());
          updateFooter(new Date());
          setLoading(false);
          return;
        }

        try {
          var response = await fetch(API_URL, {
            headers: { "X-Auth-Token": API_KEY },
          });

          if (!response.ok) {
            throw new Error("API request failed");
          }

          var data = await response.json();
          var matches = (data.matches || []).map(normalizeApiMatch);

          setNotice("");
          renderMatches(matches);
          updateFooter(new Date());
        } catch (err) {
          setNotice("Live data unavailable — showing matches from " + CONFIG.barName + ".");
          renderMatches(getFallbackMatches());
          updateFooter(new Date());
        } finally {
          setLoading(false);
        }
      }

      function startAutoRefresh() {
        refreshTimer = setInterval(loadScores, REFRESH_MS);
      }

      applyBrandColors();
      loadScores();
      startAutoRefresh();
    </script>
  </body>
</html>
