<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Cup Bracket</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="container top-bar__inner">
        <p class="top-bar__name" id="top-bar-name"></p>
      </div>
    </header>

    <nav class="site-nav" aria-label="Site navigation">
      <div class="container site-nav__inner">
        <a href="index.html" class="site-nav__tab">
          <i class="ti ti-calendar-event" aria-hidden="true"></i>
          <span>Watch Party</span>
        </a>
        <a href="scores.html" class="site-nav__tab">
          <i class="ti ti-circle" aria-hidden="true"></i>
          <span>Live Scores</span>
        </a>
        <a href="bracket.html" class="site-nav__tab site-nav__tab--active">
          <i class="ti ti-tournament" aria-hidden="true"></i>
          <span>Bracket</span>
        </a>
        <a href="countdown.html" class="site-nav__tab">
          <i class="ti ti-clock" aria-hidden="true"></i>
          <span>Countdown</span>
        </a>
      </div>
    </nav>

    <p class="bracket-banner">
      Knockout stage begins July 4, 2026 — check back as teams advance.
    </p>

    <main>
      <section class="section bracket-intro" aria-labelledby="bracket-heading">
        <div class="container">
          <p class="section-label">Knockout stage</p>
          <h1 class="section__title" id="bracket-heading">World Cup 2026 Bracket</h1>
          <p class="section__subtitle" id="bracket-subtitle"></p>
        </div>
      </section>

      <section class="section section--alt bracket-body" aria-label="Tournament bracket">
        <div class="container">
          <div class="bracket" id="bracket"></div>
          <p class="bracket-update-note">
            The bracket is updated manually after each match result.
          </p>
        </div>
      </section>
    </main>

    <footer class="footer" id="footer">
      <div class="container">
        <p class="footer__name" id="footer-name"></p>
        <p class="footer__address" id="footer-address"></p>
        <nav class="footer__social" id="footer-social" aria-label="Social links"></nav>
        <p class="footer__meta" id="footer-meta" hidden></p>
      </div>
    </footer>

    <script src="config.js"></script>
    <script src="js/shared.js"></script>
    <script>
      function createTbdMatch() {
        return { home: "TBD", away: "TBD" };
      }

      function createTbdMatches(count) {
        var matches = [];
        for (var i = 0; i < count; i++) {
          matches.push(createTbdMatch());
        }
        return matches;
      }

      var BRACKET = {
        roundOf32: createTbdMatches(16),
        roundOf16: createTbdMatches(8),
        quarterfinals: createTbdMatches(4),
        semifinals: createTbdMatches(2),
        thirdPlace: createTbdMatch(),
        final: Object.assign(createTbdMatch(), {
          meta: "July 19 · MetLife Stadium, New Jersey",
        }),
      };

      function renderTeamCard() {
        return (
          '<div class="team-card team-card--tbd">' +
          '<span class="team-card__name">TBD</span>' +
          "</div>"
        );
      }

      function renderMatch() {
        return (
          '<div class="bracket-match">' +
          renderTeamCard() +
          '<span class="bracket-match__arrow" aria-hidden="true"><i class="ti ti-arrow-right"></i></span>' +
          renderTeamCard() +
          "</div>"
        );
      }

      function renderRound(title, matches, extraMeta) {
        var metaHtml = extraMeta
          ? '<p class="bracket-round__meta">' + extraMeta + "</p>"
          : "";

        return (
          '<section class="bracket-round">' +
          '<h2 class="section-label bracket-round__title">' +
          title +
          "</h2>" +
          metaHtml +
          '<div class="bracket-round__matches">' +
          matches.map(renderMatch).join("") +
          "</div>" +
          "</section>"
        );
      }

      function renderBracket() {
        document.getElementById("bracket").innerHTML =
          renderRound("Round of 32", BRACKET.roundOf32, "32 teams") +
          renderRound("Round of 16", BRACKET.roundOf16) +
          renderRound("Quarterfinals", BRACKET.quarterfinals) +
          renderRound("Semifinals", BRACKET.semifinals) +
          renderRound("Third Place", [BRACKET.thirdPlace]) +
          renderRound("Final", [BRACKET.final], BRACKET.final.meta);
      }

      function renderPage() {
        setPageTitle("World Cup 2026 Bracket");
        document.getElementById("top-bar-name").textContent = CONFIG.barName;
        document.getElementById("bracket-subtitle").textContent =
          "Follow the knockout stage at " + CONFIG.barName + ".";
        renderSiteFooter();
      }

      applyBrandColors();
      renderPage();
      renderBracket();
    </script>
  </body>
</html>
